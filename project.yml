name: Lumora

options:
  bundleIdPrefix: com.joshicodes
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Lumora:
    type: application
    platform: macOS
    sources:
      - path: Lumora
      - path: Shared
    dependencies:
      - target: LumoraSaver
        embed: true
        codeSign: true
        copy:
          destination: resources
    info:
      path: Lumora/Info.plist
      properties:
        CFBundleDisplayName: Lumora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 JoshiCodes"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshicodes.Lumora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LumoraSaver:
    type: bundle
    platform: macOS
    sources:
      - path: LumoraSaver
      - path: Shared
    dependencies:
      - sdk: ScreenSaver.framework
    info:
      path: LumoraSaver/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: LumoraSaverView
        NSHumanReadableCopyright: "© 2026 JoshiCodes"
    settings:
      base:
        PRODUCT_NAME: Lumora
        PRODUCT_MODULE_NAME: LumoraSaver
        PRODUCT_BUNDLE_IDENTIFIER: com.joshicodes.Lumora.Saver
        WRAPPER_EXTENSION: saver
        INSTALL_PATH: $(HOME)/Library/Screen Savers
        SKIP_INSTALL: YES

  LumoraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LumoraTests
    dependencies:
      - target: Lumora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumora:
    build:
      targets:
        Lumora: all
        LumoraTests: [test]
    test:
      config: Debug
      targets:
        - LumoraTests
