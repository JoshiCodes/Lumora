name: Lumora

options:
  bundleIdPrefix: com.joshicodes
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Lumora:
    type: application
    platform: macOS
    sources:
      - path: Lumora
    info:
      path: Lumora/Info.plist
      properties:
        CFBundleDisplayName: Lumora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 JoshiCodes"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshicodes.Lumora

  LumoraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LumoraTests
    dependencies:
      - target: Lumora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumora:
    build:
      targets:
        Lumora: all
        LumoraTests: [test]
    test:
      config: Debug
      targets:
        - LumoraTests
